[project]
name = "chithi-sdk"
version = "0.1.0"
description = "Chithi SDK — encrypted file upload/download with parallel compression and encryption"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "httpx2[brotli,http2,zstd]>=2.5.0",
    "wasmtime>=45.0.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Archiving :: Compression",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chithi_wasm"]
artifacts = ["src/chithi_wasm/wasm_bindings.wasm"]
