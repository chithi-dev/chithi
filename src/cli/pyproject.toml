[project]
name = "cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # CLI
    "async-typer>=0.1.10",
    # Http Client
    "httpx2[brotli,http2,zstd]>=2.2.0",
    # Encryption (AES-256-GCM + Argon2id KDF)
    "cryptography==46.0.3",
    # ZIP with WinZip AES-256 support (matches web front-end)
    "pyzipper>=0.3.6",
    # Progress bars
    "tqdm>=4.67.0",
    # Env handling
    "pydantic-settings>=2.12.0",
    # Console Lib
    "rich>=14.3.2",
    "qrcode>=8.2",
    # Types
    "types-tqdm>=4.67.3.20260408",
    "types-qrcode>=8.2.0.20260408",
]


[dependency-groups]
build = ["nuitka>=2.8.9", "zstandard>=0.25.0"]
dev = [
    "poethepoet>=0.39.0",
    "pyrefly>=0.62.0",
    "ruff>=0.15.12",
]

[tool.poe.tasks]
nuitka-build = "python build.py"
nuitka-debug = "python build.py debug"

[tool.setuptools]
packages = ["app"]

[tool.uv]
package = true
default-groups = ['build', 'dev']


[project.scripts]
chithi = "app.__main__:main"

[tool.ruff.lint]
extend-select = ["I"] 

[tool.ruff.format]
skip-magic-trailing-comma = false  # Avoids conflict with isort.split-on-trailing-comma

[tool.ruff.lint.isort]
split-on-trailing-comma = true  # Keep this aligned with format.skip-magic-trailing-comma
combine-as-imports = true

[tool.pyrefly]
strict = true
