[package]
name = "chithi-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.100"
js-sys = "0.3.77"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
chacha20poly1305 = "0.10"
thiserror = "2.0"
rayon = "1.10"
wasm-bindgen-rayon = "1.3"
sevenz-rust2 = { version = "0.21.0", default-features = false, features = [
    "aes256_wasm",
    "bzip2",
    "compress",
    "ppmd",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
