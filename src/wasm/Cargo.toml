[package]
name = "chithi-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.100"
js-sys = "0.3.77"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
chacha20poly1305 = "0.10"
lzma-rs = "0.3"
getrandom = { version = "0.2", features = ["js"] }
thiserror = "2.0"
rayon = "1.10"
wasm-bindgen-rayon = "1.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
