[project]
name = "backend-django"
version = "0.1.0"
description = ""
requires-python = ">=3.14"
dependencies = [
    # Django core
    "django>=6.0",
    # PostgreSQL adapter
    "psycopg[binary]>=3.2",
    # GraphQL (Strawberry)
    "strawberry-graphql[django]>=0.268",
    "uvicorn[standard]>=0.34",
    # JWT auth
    "pyjwt>=2.10",
    # Cloud file storage (S3-compatible via django-storages)
    "django-storages>=1.14",
    # Redis client for rooms / pubsub / rate limiting
    "redis>=5.2",
]

[dependency-groups]
dev = [
    "pyrefly>=1.0.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.15.14",
]
types = [
    "django-stubs>=6.0.5",
]
