[project]
name = "backend-django"
version = "0.1.0"
description = "Production Django + Strawberry GraphQL backend (FastAPI migration)"
requires-python = ">=3.12"
dependencies = [
    # Django core
    "django>=6.0,<7.0",

    # PostgreSQL adapter
    "psycopg[binary]>=3.2",

    # Environment / config
    "pydantic-settings>=2.5",

    # GraphQL (Strawberry)
    "strawberry-graphql[fastapi,opentelemetry]>=0.268",
    "uvicorn[standard]>=0.34",
    "starlette>=0.46",

    # JWT auth
    "pyjwt>=2.10",

    # Password hashing (Argon2 via pwdlib)
    "pwdlib[argon2]>=0.3",

    # Cloud file storage (S3-compatible via django-storages)
    "django-storages[aiobotocore]>=1.14",

    # Redis client for rooms / pubsub / rate limiting
    "redis>=5.2",

    # Django tasks (async background tasks via Redis backend)
    "django-tasks[redis]>=0.7",

    # HTTP multipart parsing for uploads in GraphQL resolvers
    "python-multipart>=0.0.18",
    "celery-aio-pool>=0.1.0rc8",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-asyncio>=0.25",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-asyncio>=0.25",
]
