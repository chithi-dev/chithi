[workspace]
members = [
    "crates/chithi-core",
    "crates/chithi-core-wasm",
    "crates/chithi-core-py",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
chithi-core = { path = "crates/chithi-core", default-features = false }
sevenz-rust2 = { version = "0.21", default-features = false, features = [
    "compress",
    "util",
    "bzip2",
    "aes256",
] }
argon2 = "0.5"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
getrandom = { version = "0.2", features = ["js"] }
aes = "0.8"
sha2 = "0.10"
signature = { version = "2", features = ["rand_core"] }
ed25519 = { version = "2", features = ["pkcs8"] }
hkdf = "0.12"
base64 = "0.22"
hex = "0.4"
rand_core = "0.6"
cbc = "0.1"
cipher = "0.4"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
ed25519-dalek = "2"

[profile.release]
opt-level = "s"
lto = true
