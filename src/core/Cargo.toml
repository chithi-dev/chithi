[workspace]
members = [
    "crates/chithi-core",
    "crates/chithi-core-wasm",
    "crates/chithi-core-py",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
chithi-core = { path = "crates/chithi-core" }
sevenz-rust2 = { version = "0.21", default-features = false, features = ["compress", "util", "bzip2", "aes256"] }
argon2 = "0.5"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"] }

[profile.release]
opt-level = "s"
lto = true
