name: Build and Push Landing Page Docker Image to GHCR

on:
  push: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/landing-page
          file: ./apps/landing-page/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/landing-page:latest
            ghcr.io/${{ github.repository_owner }}/landing-page:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/landing-page:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
