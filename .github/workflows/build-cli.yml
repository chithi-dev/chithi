name: CLI CI/CD

on:
  push:
    branches: ['main']
    paths: ['src/cli/**', '.github/workflows/**']
  pull_request:
    branches: ['main']
    paths: ['src/cli/**', '.github/workflows/**']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            asset_name: chithi-cli-linux-amd64

          - os: ubuntu-24.04-arm
            target: linux-arm64
            asset_name: chithi-cli-linux-arm64

          - os: windows-latest
            target: windows-amd64
            asset_name: chithi-cli-windows-amd64.exe

          - os: windows-11-arm
            target: windows-arm64
            asset_name: chithi-cli-windows-arm64.exe

          - os: macos-15-intel
            target: macos-amd64
            asset_name: chithi-cli-macos-amd64

          - os: macos-latest
            target: macos-arm64
            asset_name: chithi-cli-macos-arm64

          - os: ubuntu-latest
            target: freebsd-amd64
            asset_name: chithi-cli-freebsd-amd64

    defaults:
      run:
        working-directory: ./src/cli

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # ------------------------
      # Normal environments setup
      # ------------------------
      - name: Install uv
        if: matrix.target != 'freebsd-amd64'
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install dependencies
        if: matrix.target != 'freebsd-amd64'
        run: uv sync --frozen

      # ------------------------
      # FreeBSD build (VM)
      # ------------------------
      - name: Build on FreeBSD
        if: matrix.target == 'freebsd-amd64'
        uses: vmactions/freebsd-vm@v1
        with:
          release: 14.0
          usesh: true
          prepare: |
            pkg install -y curl clang gmake

            # Install uv (standalone binary)
            fetch -o /usr/local/bin/uv https://astral.sh/uv/install.sh
            chmod +x /usr/local/bin/uv

          run: |
            cd /github/workspace/src/cli

            # Let uv manage Python version (same as other platforms)
            uv python install

            uv sync --frozen
            uv run python build.py --output ${{ matrix.asset_name }}

            # Move artifact out of VM
            cp ${{ matrix.asset_name }} /github/workspace/

      # ------------------------
      # Normal build
      # ------------------------
      - name: Build Binary
        if: matrix.target != 'freebsd-amd64'
        run: uv run python build.py --output ${{ matrix.asset_name }}

      # ------------------------
      # macOS packaging
      # ------------------------
      - name: Package macOS app
        if: startsWith(matrix.target, 'macos')
        run: |
          BINARY_NAME="${{ matrix.asset_name }}"
          APP_NAME="${BINARY_NAME}.app"

          mkdir -p "${APP_NAME}/Contents/MacOS"
          mv "$BINARY_NAME" "${APP_NAME}/Contents/MacOS/"

          zip -r "${BINARY_NAME}.zip" "$APP_NAME"

      # ------------------------
      # Upload artifacts
      # ------------------------
      - name: Upload CI Artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: |
            src/cli/${{ matrix.asset_name }}
            src/cli/${{ matrix.asset_name }}.zip
            ${{ matrix.asset_name }}
          if-no-files-found: error

      # ------------------------
      # Test CLI (skip FreeBSD)
      # ------------------------
      - name: Test CLI
        if: matrix.target != 'freebsd-amd64'
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == macos* ]]; then
            ./${{ matrix.asset_name }}.app/Contents/MacOS/${{ matrix.asset_name }} --help || { echo 'CLI failed'; exit 1; }
          else
            chmod +x ./${{ matrix.asset_name }} || true
            ./${{ matrix.asset_name }} --help || { echo 'CLI failed'; exit 1; }
          fi

      # ------------------------
      # Release upload
      # ------------------------
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            src/cli/${{ matrix.asset_name }}
            src/cli/${{ matrix.asset_name }}.zip
            ${{ matrix.asset_name }}