name: CLI CI/CD

on:
  push:
    branches: ['main']
    paths: ['src/cli/**', '.github/workflows/**']
  pull_request:
    branches: ['main']
    paths: ['src/cli/**', '.github/workflows/**']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            asset_name: chithi-cli-linux-amd64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            asset_name: chithi-cli-linux-arm64
          - os: windows-latest
            target: windows-amd64
            asset_name: chithi-cli-windows-amd64.exe
          - os: windows-11-arm
            target: windows-arm64
            asset_name: chithi-cli-windows-arm64.exe

    defaults:
      run:
        working-directory: ./src/cli

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        
      - name: Install UPX
        uses: crazy-max/ghaction-upx@v4
        with:
          install-only: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build Binary
        run: uv run python build.py --output ${{ matrix.asset_name }}

      - name: Upload CI Artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: src/cli/${{ matrix.asset_name }}
          if-no-files-found: error
    
      - name: Test CLI
        shell: bash
        run: |
          chmod +x ./${{ matrix.asset_name }} || true
          ./${{ matrix.asset_name }} --help || { echo 'CLI failed'; exit 1; }

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: src/cli/${{ matrix.asset_name }}